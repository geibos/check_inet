[package]
name = "check_inet"
version = "0.1.0"
edition = "2024"
description = "Adaptive internet connectivity diagnostics that pinpoints which layer is broken"
license = "MIT OR Apache-2.0"
repository = "https://github.com/geibos/check_inet"
readme = "README.md"
keywords = ["network", "diagnostics", "connectivity", "cli", "dns"]
categories = ["command-line-utilities", "network-programming"]
exclude = ["/docs"]

[[bin]]
name = "check-inet"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
ureq = "3.3.0"
